<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNN-FEP Transition Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #050507; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(20, 20, 25, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
        .transition-slider { -webkit-appearance: none; width: 100%; height: 8px; background: #1e1e23; border-radius: 5px; outline: none; }
        .transition-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: #6366f1; cursor: pointer; border-radius: 50%; box-shadow: 0 0 10px #6366f1; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-[1400px] mx-auto">
        <header class="mb-8 flex justify-between items-end">
            <div class="flex-1">
                <h1 class="text-3xl font-bold tracking-tighter text-white">SNN-FEP <span class="text-indigo-500">Developmental Transition</span></h1>
                <p class="text-slate-400 mt-1 text-sm">LIF Randomness $\to$ Converged FEP Conceptual Niches</p>
            </div>
            <div class="text-right font-mono text-xs text-slate-500">
                Dataset: 8-Pattern Convergence Trace
            </div>
        </header>

        <div class="grid grid-cols-12 gap-6">
            <!-- Control Panel -->
            <div class="col-span-4 space-y-6">
                <div class="glass p-6 rounded-3xl space-y-8">
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-sm font-bold uppercase tracking-widest text-indigo-400">Training Timeline</h2>
                            <span id="epoch-display" class="text-2xl font-mono text-white">Epoch: 0</span>
                        </div>
                        <input type="range" id="epoch-slider" min="0" max="99" value="0" class="transition-slider">
                        <div class="flex justify-between text-[10px] text-slate-500 mt-2 font-mono">
                            <span>LIF (Naive)</span>
                            <span>Trained (FEP)</span>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-xs font-bold text-slate-500 uppercase">Current State Analysis</h3>
                        <div id="state-metrics" class="space-y-3">
                            <!-- Dynamic metrics -->
                        </div >
                    </div>
                </div>

                <div class="glass p-6 rounded-3xl h-64 overflow-hidden">
                    <h2 class="text-sm font-bold uppercase tracking-widest text-indigo-400 mb-4">Learning Curve</h2>
                    <canvas id="convergenceChart"></canvas>
                </div>
            </div>

            <!-- Visualization Panel -->
            <div class="col-span-8 glass p-8 rounded-3xl relative">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-lg font-semibold text-white">Population Fingerprint</h2>
                    <div class="flex gap-4 text-xs font-mono">
                        <span class="flex items-center gap-2"><div class="w-3 h-3 bg-indigo-500 rounded-full"></div> Converged</span>
                        <span class="flex items-center gap-2"><div class="w-3 h-3 bg-slate-600 rounded-full"></div> Unstable</span>
                    </div>
                </div>

                <div id="neuron-grid" class="grid grid-cols-3 gap-8">
                    <!-- 9 neurons generated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let historyData = [];
        let currentEpoch = 0;
        let chart = null;

        async function loadData() {
            const response = await fetch('training_history.json');
            historyData = await response.json();
            init();
        }

        function init() {
            const grid = document.getElementById('neuron-grid');
            for(let i=0; i<9; i++) {
                const div = document.createElement('div');
                div.className = 'glass p-6 rounded-2xl flex flex-col items-center justify-center space-y-4 border-indigo-500/20';
                div.id = `neuron-${i}`;
                div.innerHTML = `
                    <div class="text-[10px] font-bold text-slate-500 uppercase">Neuron ${i}</div>
                    <div class="w-12 h-12 rounded-full bg-slate-800 transition-all duration-300" id="node-${i}"></div>
                    <div class="text-xs font-mono text-slate-400" id="meta-${i}">Wait...</div>
                `;
                grid.appendChild(div);
            }
            
            setupChart();
            updateView(0);

            document.getElementById('epoch-slider').addEventListener('input', (e) => {
                currentEpoch = parseInt(e.target.value);
                updateView(currentEpoch);
            });
        }

        function setupChart() {
            const ctx = document.getElementById('convergenceChart').getContext('2d');
            const epochs = historyData.map(d => d.epoch);
            const consistency = historyData.map(d => {
                const events = d.events;
                const winners = events.map(e => e.winner);
                const unique = new Set(winners.filter(w => w !== null)).size;
                return (unique / 8) * 100;
            });

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: epochs,
                    datasets: [{
                        label: 'Niche Occupancy %',
                        data: consistency,
                        borderColor: '#6366f1',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { size: 10 } } }
                    }
                }
            });
        }

        function updateView(epoch) {
            document.getElementById('epoch-display').innerText = `Epoch: ${epoch}`;
            const data = historyData[epoch];
            const events = data.events;
            
            // Calculate mapping for this epoch
            const mapping = {};
            events.forEach(e => {
                if(e.winner !== null) mapping[e.pattern_idx] = e.winner;
            });

            // Update Neurons
            for(let i=0; i<9; i++) {
                const node = document.getElementById(`node-${i}`);
                const meta = document.getElementById(`meta-${i}`);
                
                const patternsOwned = Object.entries(mapping).filter(([p, n]) => n === i).map(([p, n]) => p);
                
                if(patternsOwned.length > 0) {
                    node.className = 'w-12 h-12 rounded-full bg-indigo-500 shadow-[0_0_15px_#6366f1] transition-all duration-300';
                    meta.innerText = `Pattern(s): ${patternsOwned.join(', ')}`;
                    meta.className = 'text-xs font-mono text-indigo-300';
                } else if (patternsOwned.length > 1) {
                    node.className = 'w-12 h-12 rounded-full bg-rose-500 shadow-[0_0_15px_#f43f5e] transition-all duration-300';
                    meta.innerText = 'Overloaded';
                    meta.className = 'text-xs font-mono text-rose-400';
                } else {
                    node.className = 'w-12 h-12 rounded-full bg-slate-800 transition-all duration-300';
                    meta.innerText = 'Unassigned';
                    meta.className = 'text-xs font-mono text-slate-400';
                }
            }

            // Update Metrics
            const metrics = document.getElementById('state-metrics');
            const uniqueWinners = new Set(events.map(e => e.winner).filter(w => w !== null)).size;
            metrics.innerHTML = `
                <div class="flex justify-between items-center p-2 rounded bg-white/5">
                    <span class="text-[10px] text-slate-500">Niche Occupancy</span>
                    <span class="text-xs font-mono text-white">${uniqueWinners}/8</span>
                </div>
                <div class="flex justify-between items-center p-2 rounded bg-white/5">
                    <span class="text-[10px] text-slate-500">Global Stability</span>
                    <span class="text-xs font-mono text-white">${(uniqueWinners/8*100).toFixed(1)}%</span>
                </div>
            `;
        }

        loadData();
    </script>
</body>
</html>
